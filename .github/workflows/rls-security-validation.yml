name: Bodega6A RLS Security Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  rls-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate RLS test suite exists
        run: test -f supabase/tests/rls/rls_authenticated_tests.sql

      - name: RLS validation prepared
        run: echo "Authenticated users, roles and isolation tests ready"
