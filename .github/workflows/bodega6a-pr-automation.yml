name: Bodega6A PR Automation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-pr:
    name: Prepare controlled PR flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate validation artifact
        run: |
          mkdir -p automation/reports

          REPORT="automation/reports/pr-validation-${{ github.run_id }}.md"

          echo "# Automated PR validation" > "$REPORT"
          echo "" >> "$REPORT"
          echo "Generated by Bodega6A PR Automation" >> "$REPORT"
          echo "Run ID: ${{ github.run_id }}" >> "$REPORT"
          echo "Branch: automation/change-request" >> "$REPORT"

          git add -f "$REPORT"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/change-request
          delete-branch: true
          title: "Automated change request"
          commit-message: "chore: automated PR validation artifact"
          body: |
            Automated PR generated by Bodega6A workflow.

            Required checks:
            - Supabase validation
            - RLS security validation
            - CI tests
          draft: false
